[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phonedeck"
version = "0.1.0"
description = "Dashboard personalizable para controlar una PC Windows desde un celular Android antiguo."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "PhoneDeck contributors" }]
keywords = ["streamdeck", "dashboard", "android", "windows", "remote-control"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Framework :: FastAPI",
    "Topic :: Desktop Environment",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=15",  # el puente con OBS usa connect(proxy=...)
    "pydantic>=2.7",
    "psutil>=6",
    "pystray>=0.19",
    "pillow>=11",
    "qrcode>=8",
    # --- Solo Windows: capa nativa ---
    "pycaw>=20240316; sys_platform == 'win32'",
    "comtypes>=1.4; sys_platform == 'win32'",
    "winrt-runtime>=3; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3; sys_platform == 'win32'",
    "winrt-Windows.Media.Control>=3; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "pip-audit>=2.7",
]
build = ["pyinstaller>=6.10"]

[project.scripts]
phonedeck = "phonedeck.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phonedeck = ["config/default_config.json"]

# ---------------------------------------------------------------- herramientas
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "plugins", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # tildes y signos en español dentro de strings/comentarios
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ASYNC240"]
# Herramientas de desarrollo: lanzan el navegador local y llevan JS embebido en strings.
"scripts/**" = ["S603", "S310", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["phonedeck"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pycaw.*", "comtypes.*", "pystray.*", "qrcode.*", "winrt.*", "psutil.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
filterwarnings = [
    # Starlette recomienda httpx2 para su TestClient; httpx sigue funcionando.
    "ignore:Using `httpx` with",
]
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
