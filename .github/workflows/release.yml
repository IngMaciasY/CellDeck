# Release: al subir una etiqueta vX.Y.Z compila CellDeck en Windows y crea un BORRADOR de
# Release con los ejecutables. El dueño lo prueba y pulsa "Publish release" (ver docs/RELEASING.md).
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Compilar y publicar el borrador
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write # crear la Release y subir los archivos
      id-token: write # firmar la atestación (Sigstore)
      attestations: write # guardar la atestación en el repositorio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Comprobar que la etiqueta coincide con la versión del código
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = (python -c "import sys; sys.path.insert(0, 'src'); import celldeck; print(celldeck.__version__)").Trim()
          if ("v$version" -ne $env:TAG) {
            Write-Error "La etiqueta $env:TAG no coincide con __version__ = $version (src/celldeck/__init__.py)"
            exit 1
          }
          if (-not (Select-String -Path CHANGELOG.md -Pattern "^## \[$([regex]::Escape($version))\]" -Quiet)) {
            Write-Error "CHANGELOG.md no tiene la sección '## [$version]'"
            exit 1
          }

      - name: Entorno de desarrollo (tests y pip-audit)
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --disable-pip-version-check --quiet -e ".[dev]"

      - name: Tests
        run: .venv\Scripts\python -m pytest

      - name: Compilar CellDeck.exe (dependencias por hash + pip-audit)
        shell: cmd
        run: |
          for /f "delims=" %%i in ('python -c "import sys; print(sys.executable)"') do set "CELLDECK_PYTHON=%%i"
          call scripts\build.bat

      - name: Variante en carpeta, zip, SHA-256 y notas
        shell: pwsh
        run: ./scripts/package_release.ps1

      - name: Atestación de compilación
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/CellDeck.exe
            release/CellDeck-win64.zip

      - name: Crear el borrador de la Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # 0.x y las etiquetas con guion (v1.0.0-rc.1) se marcan como versión preliminar.
          $flags = @("--draft", "--verify-tag", "--title", "CellDeck $env:TAG", "--notes-file", "release/NOTES.md")
          if ($env:TAG -match '^v0\.' -or $env:TAG -match '-') { $flags += "--prerelease" }
          gh release create $env:TAG release/CellDeck.exe release/CellDeck-win64.zip release/SHA256SUMS.txt @flags
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
